<!DOCTYPE html>
<!-- Pie Chart: authenticated profile data, shared theme and reusable budget controls. -->
<html lang="en" data-session="loading">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      Budgetron 3000 · Pie Chart
    </title>
    <link rel="stylesheet" href="../../css%20files/styles.css">
    <link rel="stylesheet" href="../../css%20files/chat.css">
    <link rel="stylesheet" href="spending-chart.css">
    <script src="../../javascript%20files/theme.js">
    </script>
    <script src="../../javascript%20files/budget-core.js" defer>
    </script>
    <script src="../../javascript%20files/state.js" defer>
    </script>
    <script src="../../javascript%20files/charts.js" defer>
    </script>
    <script src="../../javascript%20files/transactions.js" defer>
    </script>
    <script src="../../javascript%20files/goals.js" defer>
    </script>
    <script src="../../javascript%20files/ui.js" defer>
    </script>
    <script src="spending-chart.js" defer>
    </script>
    <script src="../../javascript%20files/chat.js" defer>
    </script>
    <script src="../../javascript%20files/session.js" defer>
    </script>
  </head>
  <body>
    <header>
      <a class="brand" href="../home/home.html" aria-label="Budgetron 3000 trademark home">
        <span class="wordmark">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="6" width="18" height="15" rx="5"/>
            <path d="M12 6V3m-3 13h6"/>
            <circle cx="8" cy="12" r="1" fill="currentColor"/>
            <circle cx="16" cy="12" r="1" fill="currentColor"/>
          </svg>
          Budgetron
          <b>
            3000
          </b>
          <sup>
            ™
          </sup>
        </span>
        <span class="brand-tagline">
          little steps. big plans.
        </span>
      </a>
      <nav aria-label="Main navigation">
        <a href="../home/home.html">
          <span class="nav-icon" aria-hidden="true">
            ⌂
          </span>
          <span>
            Home
          </span>
        </a>
        <a href="../goals/goals.html">
          <span class="nav-icon" aria-hidden="true">
            ◎
          </span>
          <span>
            Goals
          </span>
        </a>
        <a href="../income/income.html">
          <span class="nav-icon" aria-hidden="true">
            ↗
          </span>
          <span>
            Income
          </span>
        </a>
        <a href="../expenses/expenses.html">
          <span class="nav-icon" aria-hidden="true">
            ↘
          </span>
          <span>
            Expenses
          </span>
        </a>
        <a href="../spending-chart/spending-chart.html" aria-current="page">
          <span class="nav-icon" aria-hidden="true">
            ◔
          </span>
          <span>
            Pie Chart
          </span>
        </a>
        <a href="../transactions/transactions.html">
          <span class="nav-icon" aria-hidden="true">
            ≡
          </span>
          <span>
            Transactions
          </span>
        </a>
        <a href="../calendar/calendar.html">
          <span class="nav-icon" aria-hidden="true">
            ▦
          </span>
          <span>
            Calendar
          </span>
        </a>
      </nav>
      <div class="sidebar-bottom">
      </div>
    </header>
    <main>
      <div class="page-title">
        <div>
          <h1>
            Pie Chart
          </h1>
          <p>
            Separate breakdowns of this month’s income and expenses.
          </p>
        </div>
        <div class="page-actions">
          <label class="theme-picker">
            Theme
            <select id="color-theme" aria-label="Color Theme">
              <option value="cream">
                Cream
              </option>
              <option value="sage">
                Sage
              </option>
              <option value="ocean">
                Ocean
              </option>
              <option value="rose">
                Rose
              </option>
            </select>
          </label>
          <button id="theme-toggle" class="secondary theme-toggle" type="button" aria-pressed="false">
            <span>
              Dark Mode
            </span>
            <span class="theme-switch" aria-hidden="true">
            </span>
          </button>
        </div>
      </div>
      <p class="notice">
        Your profile uses saved local data. No real banks or money transfers.
      </p>
      <section class="two-column" aria-label="Income and expense charts">
        <article class="panel">
          <h2>
            Income Breakdown
          </h2>
          <svg class="overview-donut" id="income-donut" viewBox="0 0 440 400" role="group">
          </svg>
          <p id="income-chart-total">
          </p>
          <div id="income-chart-categories" class="chart-categories">
          </div>
          <ul id="income-category-items" class="payment-list">
          </ul>
        </article>
        <article class="panel">
          <h2>
            Expense Breakdown
          </h2>
          <svg class="overview-donut" id="expense-donut" viewBox="0 0 440 400" role="group">
          </svg>
          <p id="expense-chart-total">
          </p>
          <div id="expense-chart-categories" class="chart-categories">
          </div>
          <ul id="expense-category-items" class="payment-list">
          </ul>
        </article>
      </section>
      <footer>
        <button id="reset-demo" type="button" class="text-button">
          Reset profile
        </button>
      </footer>
      <p id="status" role="status" class="status">
      </p>
    </main>
  </body>
</html>
